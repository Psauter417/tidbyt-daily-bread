name: Refresh Daily Bread

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled today's midnight refresh more than five hours late.
    # Refresh hourly so a delayed runner cannot leave yesterday's image on
    # the device all morning. Rendering is keyed to America/Chicago, so every
    # run within a local day produces the same message and date.
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Install Pixlet
        run: |
          curl -fsSLo pixlet.tar.gz https://github.com/tidbyt/pixlet/releases/download/v0.34.0/pixlet_0.34.0_linux_amd64.tar.gz
          tar -xzf pixlet.tar.gz
          chmod +x pixlet

      - name: Render daily message
        run: |
          ./pixlet render daily_bread.star 'location={"lat":36.6437,"lng":-93.2185,"locality":"Branson","timezone":"America/Chicago"}'

      - name: Push to Tidbyt
        env:
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
        run: |
          ./pixlet push --background --api-token "$TIDBYT_API_TOKEN" --installation-id dailybread "$TIDBYT_DEVICE_ID" daily_bread.webp
